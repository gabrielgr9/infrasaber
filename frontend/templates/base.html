<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}InfraSaber{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/leaflet.css') }}" />
    {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">InfraSaber</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/mapa">Mapa Interativo</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <small>&copy; 2026 InfraSaber. Todos os direitos reservados.</small>
        </div>
    </footer>

    <script src="{{ url_for('static', path='/js/leaflet.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>

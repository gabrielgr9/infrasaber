<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Órgãos Públicos - InfraSaber</title>
    <link rel="icon" type="image/png" href="../static/images/1033947.png">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/sidebar.css') }}">
    <style>
        body {
            margin: 0;
            background-color: #f8f9fa;
            display: flex;
        }
        .main-content {
            margin-left: 80px;
            width: calc(100% - 80px);
            min-height: 100vh;
            padding: 30px;
            transition: margin-left 0.3s ease;
        }
        .card-orgao {
            background: white;
            border-radius: 12px;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .card-orgao:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
        }
        .card-body {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .card-text-content {
            flex: 1;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR COMPLETA -->
    <nav class="side-menu">
        <div class="btn-expandir">
            <i class="bi bi-list" id="btnc-exp"></i>
        </div>
        <ul>
            <li class="iten-menu">
                <a href="/dashboard">
                    <span class="icon"><i class="bi bi-columns-gap"></i></span>
                    <span class="txt-link">Dashboard</span>
                </a>
            </li>
            <li class="iten-menu">
                <a href="/mapa">
                    <span class="icon"><i class="bi bi-wifi"></i></span>
                    <span class="txt-link">Ponto de Internet</span>
                </a>
            </li>
            <li class="iten-menu">
                <a href="/problemas">
                    <span class="icon"><i class="bi bi-stickies"></i></span>
                    <span class="txt-link">Relatar Problema</span>
                </a>
            </li>
            <li class="iten-menu">
                <a href="/cursosoficinas">
                    <span class="icon"><i class="bi bi-book"></i></span>
                    <span class="txt-link">Cursos e Oficinas</span>
                </a>
            </li>
            <li class="iten-menu">
                <a href="/iniciativas">
                    <span class="icon"><i class="bi bi-person-arms-up"></i></span>
                    <span class="txt-link">Iniciativa Social</span>
                </a>
            </li>
            <li class="iten-menu ativo">
                <a href="/orgaos">
                    <span class="icon"><i class="bi bi-bank"></i></span>
                    <span class="txt-link">Orgãos Públicos</span>
                </a>
            </li>
            <li class="iten-menu">
                <a href="/feedbacks">
                    <span class="icon"><i class="bi bi-star"></i></span>
                    <span class="txt-link">Feedbacks</span>
                </a>
            </li>
            <li class="iten-menu">
                <a href="/conta">
                    <span class="icon"><i class="bi bi-person-circle"></i></span>
                    <span class="txt-link">Conta</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
        <div class="container-fluid">
            <div class="row mb-4">
                <div class="col">
                    <h2 class="fw-bold text-dark">Órgãos Públicos</h2>
                    <p class="text-muted">Consulte informações de contato, endereços e serviços prestados pelos órgãos públicos da região.</p>
                </div>
            </div>

            <!-- GRID DE CARDS LADO A LADO -->
            <div class="row g-4" id="container-orgaos">
                <div class="col-12 text-center text-muted py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2">Carregando órgãos públicos...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- SCRIPTS -->
    <script src="{{ url_for('static', path='/js/sidebar.js') }}"></script>
    <script src="{{ url_for('static', path='/js/orgaos.js') }}"></script>
</body>
</html>
